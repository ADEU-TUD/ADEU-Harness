name: Build & Release (Android + Windows)

# Only started by hand (Actions › Build & Release › Run workflow), because the Actions minutes of the account are
# used up: releases are built locally instead (README › Release ohne GitHub Actions). Started on the default branch
# it publishes a normal release, on other branches a pre-release. The same workflow also runs in the copy of the
# repository at ADEU-TUD/test, whose run numbers start at 1 – there the version number is given when starting it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer (z.B. 27 für 1.0.27); leer = Laufnummer. Muss größer sein als die installierte Version.'
        required: false
        default: ''
      notes:
        description: 'Was ist neu? Erscheint im Update-Hinweis der Apps (kurz, für Nutzer:innen ohne Technikkenntnisse).'
        required: false
        default: ''
      macos_linux:
        description: 'Auch macOS und Linux bauen und testen (macOS-Minuten zählen in privaten Repositorys zehnfach).'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ inputs.version || github.run_number }}
  VERSION_NAME: 1.0.${{ inputs.version || github.run_number }}
  # Draft release that carries the built files between the jobs (instead of Actions artifacts, whose small storage
  # quota ran full); the release job deletes it again.
  TRANSFER: ci-${{ github.run_id }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Draft release for the built files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Drafts of earlier runs that were cancelled before their release job removed them (older than 3 hours, so a
          # run on another branch keeps its own).
          gh release list --limit 100 --json tagName,isDraft,createdAt \
            --jq '.[] | select(.isDraft and (.tagName | startswith("ci-")) and (now - (.createdAt | fromdateiso8601) > 10800)) | .tagName' |
            while read -r tag; do gh release delete "$tag" --yes || true; done || true
          gh release create "$TRANSFER" --draft --title "Zwischenablage für Lauf ${{ github.run_id }}" --notes "Wird vom Workflow wieder gelöscht."

  build:
    needs: prepare
    # Skipped jobs cost no minutes; smoke-test and release are skipped along with it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # llama-server for local models takes a few minutes to compile; speech libraries and models are downloads.
      - uses: actions/cache@v4
        with:
          path: |
            build/llama-cache
            build/speech-downloads
          key: natives-android-${{ hashFiles('app/llama.gradle.kts', 'speech/natives.gradle.kts') }}

      # NDK for llama-server (local language models); the version is the one in app/build.gradle.kts.
      - name: Install Android NDK
        run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          ls "$ANDROID_HOME/ndk"

      # The release key lives in the repository secrets (README › Signaturschlüssel), not in the code. Until they are
      # set, the previous key from the history of the repository is used, so releases still install as updates.
      - name: Signaturschlüssel
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets für den Signaturschlüssel fehlen – es wird der bisherige, öffentlich in der Git-Historie liegende Schlüssel verwendet (README › Signaturschlüssel)."
            git fetch --no-tags --depth=1 origin 8805f165bb0ce5e2499cbccb1fb7d7ba788ecbbb 2>/dev/null || git fetch --no-tags --unshallow origin
            git show 8805f165bb0ce5e2499cbccb1fb7d7ba788ecbbb:app/release.keystore > "$RUNNER_TEMP/release.keystore"
            {
              echo "KEYSTORE_PASSWORD=llmhub-release"
              echo "KEY_ALIAS=llmhub"
              echo "KEY_PASSWORD=llmhub-release"
            } >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "ADEU-LLM-${VERSION_NAME}.apk"

      - name: Hand the APK on
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TRANSFER" "ADEU-LLM-${VERSION_NAME}.apk" --clobber

  # Installs the APK on an emulator (as update over the latest release), opens every screen and
  # fails if the app crashes – so no release ships that cannot be opened.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the new APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TRANSFER" --pattern '*.apk' --dir new

      - name: Download previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [ -n "$tag" ]; then gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir old || true; fi
          ls -l old new

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        # Only the test report; a full artifact storage must not stop the release.
        continue-on-error: true
        with:
          name: smoke-test-${{ env.VERSION_NAME }}
          path: smoke/
          retention-days: 3

  # Portable Windows version (same features, shares the code of the app): one EXE that needs no
  # installation and no admin rights, plus the same as ZIP. Started once on Windows before release.
  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: build/speech-downloads
          key: natives-windows-${{ hashFiles('speech/natives.gradle.kts') }}

      - name: Build Windows app
        run: .\gradlew.bat -p desktop --no-daemon createDistributable

      - name: Pack portable EXE and ZIP
        run: .github/scripts/windows-portable.ps1 -Version $env:VERSION_NAME

      - name: Start test (every screen, PDF/Word)
        run: .github/scripts/windows-selftest.ps1 -Exe "dist/ADEU-LLM-$env:VERSION_NAME-Windows.exe"

      - name: Hand the EXE and ZIP on
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$env:TRANSFER" "dist/ADEU-LLM-$env:VERSION_NAME-Windows.exe" "dist/ADEU-LLM-$env:VERSION_NAME-Windows.zip" --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: windows-selftest-${{ env.VERSION_NAME }}
          path: selftest/
          retention-days: 3

  # macOS version (AP-31, Apple Silicon only): DMG for the first installation, tar.gz with "ADEU LLM.app" for the
  # automatic update. macOS minutes count ten times on private repositories, so this job only builds, packs and starts
  # the app once (the shared code is tested by the PR-Check). Signature and notarization only with the optional
  # secrets MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, MAC_SIGN_IDENTITY (+ MAC_NOTARY_APPLE_ID, MAC_NOTARY_PASSWORD,
  # MAC_NOTARY_TEAM_ID); without them Compose signs ad hoc and macOS asks once before the first start.
  # The Mac part is a workflow of its own (AP-115), so it can be run again alone for a release that came out without
  # it (Actions › macOS-Version › Run workflow, same version number) – see .github/workflows/macos.yml.
  macos:
    needs: prepare
    if: inputs.macos_linux
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ inputs.version || github.run_number }}
      transfer: ci-${{ github.run_id }}
    secrets: inherit

  # Linux version (AP-31, x64): tar.gz with the folder "ADEU LLM" (start without installing, automatic update) and the
  # Debian package "adeu-llm". Started once without a screen (Xvfb) like the Windows version.
  # Ubuntu 24.04: on 22.04 the speech library (sherpa-onnx) crashed in the start test while loading the voice activity
  # detection (release 1.0.48); on 24.04 it runs. jpackage takes the package dependencies from the build machine, so
  # the .deb is for Ubuntu 24.04 / Debian 13 and newer ("t64" names).
  linux:
    needs: prepare
    if: inputs.macos_linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The bundled Java runtime comes from Ubuntu's OpenJDK, not Temurin: Temurin's JVM for Linux carries its own
      # copy of the C++ library, and next to the system copy that sherpa-onnx uses, formatting numbers in native code
      # crashed (SIGSEGV in Vad_newFromFile when transcription starts; reproduced with Temurin 21.0.12 and 21.0.13,
      # not with Ubuntu's 21.0.12). jpackage takes the runtime from the JDK that runs Gradle.
      - name: Java 21 (OpenJDK von Ubuntu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openjdk-21-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: build/speech-downloads
          key: natives-linux-${{ hashFiles('speech/natives.gradle.kts') }}

      # dpkg-deb, fakeroot (packageDeb) and Xvfb (start test) are part of the runner image; install them if not.
      - name: Tools for the DEB package and the start test
        run: |
          missing=()
          command -v fakeroot > /dev/null || missing+=(fakeroot)
          command -v xvfb-run > /dev/null || missing+=(xvfb)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q "${missing[@]}"
          fi

      - name: Build Linux app (DEB)
        run: ./gradlew -p desktop --no-daemon createDistributable packageDeb

      - name: Pack tar.gz and DEB
        run: bash .github/scripts/desktop-package.sh linux "$VERSION_NAME"

      - name: Start test (every screen, PDF/Word)
        run: |
          app="$RUNNER_TEMP/linux-app"
          mkdir -p "$app"
          tar -xzf "dist/ADEU-LLM-$VERSION_NAME-Linux.tar.gz" -C "$app"
          # The self test prints PDFs with the runner's Google Chrome; from Ubuntu 24.04 on the user namespaces its
          # sandbox needs are blocked unless this is off (no such setting on 22.04 – then nothing happens).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null 2>&1 || true
          xvfb-run -a -s "-screen 0 1600x1000x24" bash .github/scripts/desktop-selftest.sh "$app/ADEU LLM/bin/ADEU LLM"

      - name: Hand the tar.gz and DEB on
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TRANSFER" "dist/ADEU-LLM-$VERSION_NAME-Linux.tar.gz" "dist/ADEU-LLM-$VERSION_NAME-Linux.deb" --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: linux-selftest-${{ env.VERSION_NAME }}
          path: selftest/
          retention-days: 3

  # Builds of main and tags become normal releases; builds of other branches appear as pre-releases.
  # Normal releases also go to the public update repository, from where the apps update themselves.
  # macOS and Linux are skipped when started with macos_linux = false. A failed Linux build or start test stops the
  # release; macOS is optional: if its job does not run (no macOS runners for the account) or fails, the release
  # appears without the Mac files and says so.
  release:
    needs: [smoke-test, windows, macos, linux]
    if: >-
      !cancelled() && needs.smoke-test.result == 'success' && needs.windows.result == 'success'
      && (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: macOS fehlt?
        if: needs.macos.result != 'success' && needs.macos.result != 'skipped'
        run: |
          echo "::warning title=Ohne macOS::Der macOS-Job endete mit „${{ needs.macos.result }}“ – dieses Release erscheint ohne Mac-Version. Nachholen: Actions › macOS-Version › Run workflow mit derselben Versionsnummer."
          echo "### Ohne macOS" >> "$GITHUB_STEP_SUMMARY"
          echo "Der macOS-Job endete mit **${{ needs.macos.result }}** – das Release erscheint ohne Mac-Dateien." >> "$GITHUB_STEP_SUMMARY"
          echo "Nachholen ohne alles neu zu bauen: *Actions › macOS-Version › Run workflow* mit derselben Versionsnummer (baut nur den Mac-Teil, hängt DMG und tar.gz an das Release und veröffentlicht das Update erneut)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: |
            .github/scripts
            .github/updater

      - name: Get the built files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TRANSFER" --pattern 'ADEU-LLM-*'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ github.ref_name != github.event.repository.default_branch && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          TITLE="Lora ${VERSION_NAME}"
          NOTES="Automatischer Build von ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Android: APK herunterladen und installieren. Windows: ADEU-LLM-${VERSION_NAME}-Windows.exe herunterladen und starten – keine Installation, keine Admin-Rechte."
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then
            TITLE="${TITLE} (Vorabversion)"
            NOTES="Vorabversion vom Branch ${GITHUB_REF_NAME} (${GITHUB_SHA::7}), noch nicht in ${{ github.event.repository.default_branch }} übernommen. Android: APK installieren. Windows: die EXE starten (keine Installation, keine Admin-Rechte)."
            FLAGS="--prerelease"
          fi
          FILES=("ADEU-LLM-${VERSION_NAME}.apk" "ADEU-LLM-${VERSION_NAME}-Windows.exe" "ADEU-LLM-${VERSION_NAME}-Windows.zip")
          # macOS and Linux (AP-31), unless the run was started without them.
          if [ -f "ADEU-LLM-${VERSION_NAME}-macOS.dmg" ]; then
            FILES+=("ADEU-LLM-${VERSION_NAME}-macOS.dmg" "ADEU-LLM-${VERSION_NAME}-macOS.tar.gz")
            NOTES="${NOTES} macOS (Apple-Chip): ADEU-LLM-${VERSION_NAME}-macOS.dmg öffnen und die App in den Ordner Programme ziehen."
          fi
          if [ -f "ADEU-LLM-${VERSION_NAME}-Linux.tar.gz" ]; then
            FILES+=("ADEU-LLM-${VERSION_NAME}-Linux.tar.gz" "ADEU-LLM-${VERSION_NAME}-Linux.deb")
            NOTES="${NOTES} Linux: ADEU-LLM-${VERSION_NAME}-Linux.tar.gz entpacken und im Ordner ADEU LLM/bin das Programm ADEU LLM starten oder die .deb installieren."
          fi
          # A re-run (e.g. after adding UPDATER_TOKEN) replaces the files instead of failing.
          if gh release view "v${VERSION_NAME}" >/dev/null 2>&1; then
            gh release upload "v${VERSION_NAME}" "${FILES[@]}" --clobber
          else
            gh release create "v${VERSION_NAME}" "${FILES[@]}" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              $FLAGS
          fi

      # The apps check https://github.com/ADEU-TUD/ADEU-Harness-Updater/releases/latest/download/version.json at
      # every start. Needs the secret UPDATER_TOKEN (README › Automatische Updates); without it this step only warns.
      - name: Für automatische Updates veröffentlichen
        if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.UPDATER_TOKEN }}
          UPDATE_NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret UPDATER_TOKEN fehlt – die Version erscheint nicht als automatisches Update (README › Automatische Updates)."
            exit 0
          fi
          mkdir -p dist
          cp "ADEU-LLM-${VERSION_NAME}.apk" "ADEU-LLM-${VERSION_NAME}-Windows.zip" "ADEU-LLM-${VERSION_NAME}-Windows.exe" dist/
          # macOS/Linux (AP-31): the tar.gz go into version.json ("macos", "linux"), DMG and DEB only into the release.
          for f in "ADEU-LLM-${VERSION_NAME}"-macOS.* "ADEU-LLM-${VERSION_NAME}"-Linux.*; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          bash src/.github/scripts/publish-update.sh "$VERSION_NAME" dist

      - name: Remove the draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "$TRANSFER" --yes || true
