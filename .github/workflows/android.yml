name: Build & Release APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "LLMHub-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LLMHub-${{ env.VERSION_NAME }}
          path: LLMHub-*.apk

      # Builds of main and tags become normal releases; builds of other branches appear as pre-releases.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.ref_name != github.event.repository.default_branch && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          TITLE="LLM Hub ${VERSION_NAME}"
          NOTES="Automatischer Build von ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). APK herunterladen und auf dem Android-Gerät installieren."
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then
            TITLE="${TITLE} (Vorabversion)"
            NOTES="Vorabversion vom Branch ${GITHUB_REF_NAME} (${GITHUB_SHA::7}), noch nicht in ${{ github.event.repository.default_branch }} übernommen. APK herunterladen und auf dem Android-Gerät installieren."
            FLAGS="--prerelease"
          fi
          gh release create "v${VERSION_NAME}" "LLMHub-${VERSION_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            $FLAGS
