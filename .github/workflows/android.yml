name: Build & Release APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "LLMHub-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LLMHub-${{ env.VERSION_NAME }}
          path: LLMHub-*.apk

      - name: Publish GitHub release
        if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" "LLMHub-${VERSION_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "LLM Hub ${VERSION_NAME}" \
            --notes "Automatischer Build von ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). APK herunterladen und auf dem Android-Gerät installieren."
