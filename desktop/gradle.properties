# The desktop build is started with -p desktop and does not read ../gradle.properties; without this the Kotlin
# compiler runs out of memory (512 MB default) on the GitHub runners. It keeps up to 2.4 GB while it translates the
# app (1.0.63), so 3 GB were close: 4 GB. The macOS release (7 GB runner) sets its own values (android.yml).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
kotlin.code.style=official
